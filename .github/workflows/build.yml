name: Build and test
on:
  push:
  pull_request:
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore WirelessSecurityAnalyzer.sln --locked-mode
      - run: dotnet build WirelessSecurityAnalyzer.sln -c Release --no-restore
      - run: dotnet test WirelessSecurityAnalyzer.sln -c Release --no-build
      - if: runner.os == 'Windows'
        run: dotnet publish src/WirelessSecurityAnalyzer.App -c Release -p:PublishProfile=WindowsX64
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WirelessSecurityAnalyzer-win-x64
          path: publish/win-x64/
